[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amir-beckett"
version = "0.1.0"
description = "Amir Beckett: Warframe voice greetings and news Discord bot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "discord.py[voice]>=2.7.1,<2.8",
    "aiohttp>=3.14,<4",
    "aiosqlite>=0.22,<0.23",
    "feedparser>=6.0.14,<7",
    "pydantic>=2.14,<3",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "imageio-ffmpeg>=0.6",
    "black>=26.10",
    "isort>=9.0",
    "ruff>=0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/amir"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib --cov=amir --cov-report=term-missing --cov-fail-under=96"
testpaths = ["tests"]
filterwarnings = [
    # discord.py 2.7.1 imports the stdlib audioop module, deprecated on Python 3.12.
    "ignore:'audioop' is deprecated:DeprecationWarning:discord.player",
]
